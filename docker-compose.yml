services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-anime}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-animepass}
      - POSTGRES_DB=${POSTGRES_DB:-anime}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-anime} -d $${POSTGRES_DB:-anime}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web_service:
    build:
      context: ./services/web_service
      dockerfile: Dockerfile
    image: web_service:v1
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://anime:animepass@postgres:5432/anime
      - FEATURE_STORE_URL=http://feature_store_service:8002
      - RECOMMEND_URL=http://recommend_service:8001
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  recommend_service:
    build:
      context: .
      dockerfile: ./services/recommend_service/Dockerfile
    image: recommend_service:v1
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - FEATURE_STORE_URL=http://feature_store_service:8002
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBED_MODEL=text-embedding-3-small
      - LLM_MODEL=gpt-4o
    volumes:
      - ./model:/app/model
    depends_on:
      - qdrant

  feature_store_service:
    build:
      context: ./services/feature_store_service
      dockerfile: Dockerfile
    image: feature_store_service:v1
    ports:
      - "8002:8002"

  qdrant:
    # NOTE: qdrant image ships neither wget nor curl, so no container healthcheck;
    # dependents must tolerate slow start (rag_router connects per-request).
    image: qdrant/qdrant:v1.13.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
